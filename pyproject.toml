[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "null-repair"
version = "0.1.0"
description = "LLM-based repair of static nullability errors — evaluation and tooling"
requires-python = ">=3.10"

dependencies = [
    # Data analysis / evaluation
    "scikit-learn",
    "numpy",
    "pandas",
    "matplotlib",
    "matplotlib_venn",
    "venn",
    "jupyter",
    # mini-swe-agent dependencies (inlined so no path-dep is needed)
    "pyyaml",
    "requests",
    "jinja2",
    "litellm >= 1.75.5",
    "tenacity",
    "rich",
    "python-dotenv",
    "typer",
    "platformdirs",
    "textual",
    "prompt_toolkit",
    "openai != 1.100.0,!=1.100.1",
]

[project.scripts]
mini = "minisweagent.run.mini:app"
mini-swe-agent = "minisweagent.run.mini:app"
mini-extra = "minisweagent.run.mini_extra:main"
mini-e = "minisweagent.run.mini_extra:main"

[tool.setuptools.packages.find]
# Pick up minisweagent from the submodule's src layout as well
where = ["mini-swe-agent-for-nullaway-codefix/src"]
include = ["minisweagent*"]

[tool.setuptools.package-data]
minisweagent = ["config/**/*"]
